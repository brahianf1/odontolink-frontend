# =============================================================================
# OdontoLink frontend — virtual hosts
# =============================================================================

# -----------------------------------------------------------------------------
# Catch-all: any request that doesn't match the production host is dropped.
# Traefik already filters by Host, but defending the origin against direct-IP
# scans is cheap and shrinks the attack surface.
# -----------------------------------------------------------------------------
server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    # 444 = close connection without response. Bots can't fingerprint us.
    return 444;
}

# -----------------------------------------------------------------------------
# Production virtual host
#
# `__APP_HOSTNAME__` is replaced at image-build time with the APP_HOSTNAME
# build arg (default: odontolink.utnpf.site). See Dockerfile.
# -----------------------------------------------------------------------------
server {
    listen      8080;
    listen      [::]:8080;
    server_name __APP_HOSTNAME__;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- Early-stage filters ------------------------------------------------
    if ($bad_bot)    { return 444; }
    if ($bad_method) { return 405; }

    # ---- Connection & request rate caps -------------------------------------
    limit_conn conn_per_ip 50;
    limit_req  zone=req_general burst=60 nodelay;

    # ---- Default security headers (server scope) ----------------------------
    # `add_header` inheritance: if a location adds its own header, server-scope
    # `add_header`s are dropped. Locations that override Cache-Control re-
    # include the snippet to keep all security headers attached.
    include /etc/nginx/snippets/security-headers.conf;

    # ---- Healthcheck (Dokploy / Docker Swarm) -------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Public assets that must remain reachable ---------------------------
    location = /robots.txt              { access_log off; log_not_found off; try_files $uri =404; }
    location = /favicon.ico             { access_log off; log_not_found off; try_files $uri =404; }
    location = /.well-known/security.txt { access_log off; try_files $uri =404; }

    # ---- Block well-known abuse / recon paths -------------------------------
    # Closes the connection silently for the noisy probes that hit any public
    # IP within minutes: WordPress, env files, git metadata, dotfiles, etc.
    location ~* /\.(?!well-known/) {
        access_log off;
        return 444;
    }
    location ~* (?:\.git/|\.svn/|\.hg/|\.env(?:\..*)?$|\.htaccess|\.htpasswd|\.DS_Store|\.bak$|~$) {
        access_log off;
        return 444;
    }
    location ~* (?:wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpinfo|phpmyadmin|adminer|/cgi-bin/) {
        access_log off;
        return 444;
    }
    location ~* \.(?:php|asp|aspx|jsp|cgi|pl|sh|exe|dll)$ {
        access_log off;
        return 444;
    }

    # ---- Hashed Vite assets — immutable, year-long cache --------------------
    location ^~ /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri =404;
    }

    # ---- Other static files — shorter cache ---------------------------------
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|otf|eot|json|wasm|map)$ {
        access_log off;
        expires    7d;
        add_header Cache-Control "public, max-age=604800" always;
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri =404;
    }

    # ---- index.html — must not be cached so users get new bundles -----------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------------
    location / {
        limit_req  zone=req_strict burst=20 nodelay;
        add_header Cache-Control "no-store, must-revalidate" always;
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri /index.html;
    }

    # ---- Error pages --------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        add_header Content-Type text/plain;
        return 503 "Service temporarily unavailable.\n";
    }
}
