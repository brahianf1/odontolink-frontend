# =============================================================================
# Shared security headers
# -----------------------------------------------------------------------------
# Include this snippet from every location that has its own `add_header`
# directive, because nginx drops inherited headers at any scope that
# introduces a local `add_header`.
# =============================================================================

# HSTS — Cloudflare also enforces this at the edge; setting it at the origin
# protects against accidental edge misconfiguration. `preload` is safe only
# after you've submitted the apex to https://hstspreload.org/ — leave the
# directive on for the subdomain (no harm), but don't preload the apex until
# every subdomain is HTTPS-ready.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Clickjacking / framing — CSP frame-ancestors is the modern control; XFO
# stays for older browsers that ignore CSP.
add_header X-Frame-Options "DENY" always;

# MIME-sniffing protection.
add_header X-Content-Type-Options "nosniff" always;

# Referrer hygiene — send origin only on cross-origin navigations.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable powerful browser features the app doesn't need.
#
# Only currently-standardised features are listed; six tokens that browsers
# log as "Unrecognized feature" in 2026 were removed (ambient-light-sensor,
# battery, document-domain, execution-while-not-rendered,
# execution-while-out-of-viewport, navigation-override) — all either
# abandoned proposals or deprecated APIs no longer covered by
# Permissions-Policy. Re-add only when (and if) browsers re-introduce them.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# Cross-origin isolation primitives.
# COEP is left out — `require-corp` breaks third-party assets (Google Fonts,
# CDN images) and the app doesn't use SharedArrayBuffer/threads.
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Legacy XSS filter — explicitly disabled. Modern browsers ignore it; old
# Edge/Chrome implementations had bugs that introduced vulnerabilities.
add_header X-XSS-Protection "0" always;

# Content Security Policy.
# - script-src 'self' — the bundle and /boot.js are served same-origin; no
#   inline <script> elements remain in the production HTML.
# - script-src https://static.cloudflareinsights.com — the Cloudflare Web
#   Analytics beacon is an external <script src=...> automatically injected
#   by CF when the zone is proxied; whitelisting the official CF domain
#   keeps Web Analytics working under a strict no-`unsafe-inline` policy.
#   (Per https://developers.cloudflare.com/fundamentals/reference/policies-compliances/content-security-policies/)
# - style-src 'self' 'unsafe-inline' — required for MUI / Emotion runtime CSS.
# - connect-src — explicit allow-list for the backend API. Web Analytics in
#   automatic mode reports to /cdn-cgi/rum on the same origin, so 'self'
#   already covers it; no extra entry needed here.
# - img-src — allow data:/blob: for inline previews, the API for clinic media,
#   and the public Cloudflare R2 bucket that serves user profile pictures
#   (https://pub-7d7e0e75249444ed98f64d949a52b69e.r2.dev/profile-pictures/...).
# - frame-ancestors 'none' — modern equivalent of X-Frame-Options: DENY.
#   (Controls who can embed US; unrelated to who WE embed.)
# - frame-src — the home page embeds Google Maps via an <iframe>, so the
#   maps origins must be whitelisted; everything else is implicitly blocked.
# - upgrade-insecure-requests — defends against accidental http:// references.
#
# NOTE: Cloudflare features that inject inline JS (Rocket Loader, Email
# Obfuscation, etc.) are intentionally incompatible with this policy and
# must be disabled at the Cloudflare zone level rather than relaxed here.
#
# `__API_ORIGIN__` is replaced at image-build time with the scheme://host
# portion of VITE_API_BASE_URL (see Dockerfile). If you ever see the literal
# placeholder in the served headers, the build arg was missing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; script-src-elem 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__ https://pub-7d7e0e75249444ed98f64d949a52b69e.r2.dev; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.google.com https://maps.google.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
