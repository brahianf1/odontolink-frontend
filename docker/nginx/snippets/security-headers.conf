# =============================================================================
# Shared security headers
# -----------------------------------------------------------------------------
# Include this snippet from every location that has its own `add_header`
# directive, because nginx drops inherited headers at any scope that
# introduces a local `add_header`.
# =============================================================================

# HSTS — Cloudflare also enforces this at the edge; setting it at the origin
# protects against accidental edge misconfiguration. `preload` is safe only
# after you've submitted the apex to https://hstspreload.org/ — leave the
# directive on for the subdomain (no harm), but don't preload the apex until
# every subdomain is HTTPS-ready.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Clickjacking / framing — CSP frame-ancestors is the modern control; XFO
# stays for older browsers that ignore CSP.
add_header X-Frame-Options "DENY" always;

# MIME-sniffing protection.
add_header X-Content-Type-Options "nosniff" always;

# Referrer hygiene — send origin only on cross-origin navigations.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable powerful browser features the app doesn't need.
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# Cross-origin isolation primitives.
# COEP is left out — `require-corp` breaks third-party assets (Google Fonts,
# CDN images) and the app doesn't use SharedArrayBuffer/threads.
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Legacy XSS filter — explicitly disabled. Modern browsers ignore it; old
# Edge/Chrome implementations had bugs that introduced vulnerabilities.
add_header X-XSS-Protection "0" always;

# Content Security Policy.
# - script-src 'self' — the bundle and /boot.js are both served same-origin;
#   no inline <script> elements remain in the production HTML.
# - style-src 'self' 'unsafe-inline' — required for MUI / Emotion runtime CSS.
# - connect-src — explicit allow-list for the backend API.
# - img-src — allow data:/blob: for inline previews and the API for clinic media.
# - frame-ancestors 'none' — modern equivalent of X-Frame-Options: DENY.
#   (Controls who can embed US; unrelated to who WE embed.)
# - frame-src — the home page embeds Google Maps via an <iframe>, so the
#   maps origins must be whitelisted; everything else is implicitly blocked.
# - upgrade-insecure-requests — defends against accidental http:// references.
#
# `__API_ORIGIN__` is replaced at image-build time with the scheme://host
# portion of VITE_API_BASE_URL (see Dockerfile). If you ever see the literal
# placeholder in the served headers, the build arg was missing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-elem 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.google.com https://maps.google.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
