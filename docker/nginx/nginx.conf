# =============================================================================
# OdontoLink frontend — Nginx main config
# Runs inside nginxinc/nginx-unprivileged (non-root user, listens on :8080).
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

# /tmp/nginx.pid is the upstream-documented path for nginx-unprivileged:
# /tmp is 1777 (world-writable + sticky), and `nginx -t` opens the pid file
# for write during validation, so this step must run in the same UID
# context as the runtime master (USER nginx) or the test leaves a root-
# owned pid file that the runtime can't overwrite. See Dockerfile.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # MIME / charset
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types
        text/css
        text/plain
        text/vnd.wap.wml
        application/javascript
        application/json
        application/rss+xml
        application/xml;

    # Never advertise the nginx version.
    server_tokens off;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile           on;
    sendfile_max_chunk 1m;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    keepalive_requests 1000;
    types_hash_max_size        2048;
    server_names_hash_bucket_size 128;

    # -------------------------------------------------------------------------
    # Hardening — request / header / body limits.
    # Tuned for a static SPA: there are no large uploads; cap everything tight
    # to neutralise slowloris-style attacks and giant header injections.
    # -------------------------------------------------------------------------
    client_max_body_size       1m;
    client_body_buffer_size    128k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    client_body_timeout        10s;
    client_header_timeout      10s;
    send_timeout               10s;
    reset_timedout_connection  on;

    # -------------------------------------------------------------------------
    # Real client IP — restore the visitor IP from Cloudflare's headers so
    # rate-limiting, logs and bot filters see the actual source, not Cloudflare.
    # The IP ranges are loaded from a snippet and should be refreshed
    # periodically (see DEPLOYMENT.md → "Refresh Cloudflare IPs").
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    # Structured (JSON) access log — easy to ship to Loki/ELK from Dokploy.
    # Health-check noise is filtered out so logs stay actionable.
    # -------------------------------------------------------------------------
    log_format main_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"realip_remote_addr":"$realip_remote_addr",'
            '"cf_ray":"$http_cf_ray",'
            '"cf_country":"$http_cf_ipcountry",'
            '"host":"$host",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_time":$request_time'
        '}';

    map $request_uri $loggable {
        default                       1;
        ~^/healthz$                   0;
        ~^/favicon\.ico$              0;
    }

    access_log /dev/stdout main_json if=$loggable;

    # -------------------------------------------------------------------------
    # Bot / scraper filter.
    # Hits return 444 (drop connection, no response body — minimises bandwidth
    # and makes the origin look unresponsive to scanners).
    # -------------------------------------------------------------------------
    map $http_user_agent $bad_bot {
        default                                                              0;

        # Aggressive SEO crawlers that ignore robots.txt and burn bandwidth.
        ~*(SemrushBot|MJ12bot|AhrefsBot|DotBot|PetalBot|BLEXBot|seznambot)   1;
        ~*(DataForSeoBot|SeekportBot|serpstatbot|MegaIndex|ZoominfoBot)      1;
        ~*(MauiBot|Barkrowler|magpie-crawler|TalkTalk|Mb2345Browser)         1;
        ~*(YandexBot|Sogou|Baiduspider|Bytespider)                           1;

        # AI scrapers that produce log noise without business value.
        ~*(GPTBot|ChatGPT-User|CCBot|anthropic-ai|ClaudeBot|Claude-Web)      1;
        ~*(PerplexityBot|YouBot|cohere-ai|Diffbot|Omgili|ImagesiftBot)       1;
        ~*(Applebot-Extended|FacebookBot|AwarioRssBot|VelenPublicWebCrawler) 1;

        # Recon / exploitation tooling.
        ~*(nikto|sqlmap|nmap|masscan|zgrab|wpscan|acunetix|nessus|fimap)     1;
        ~*(dirbuster|gobuster|feroxbuster|fuzz|burpcollaborator|netsparker)  1;

        # Generic library UAs used by abusers (real users never send these).
        ~*(libwww-perl|python-requests/|Go-http-client|Java/|okhttp/|axios/) 1;

        # Empty UA — practically always automated.
        ""                                                                   1;
    }

    map $request_method $bad_method {
        default 1;
        GET     0;
        HEAD    0;
        POST    0;
        OPTIONS 0;
    }

    # -------------------------------------------------------------------------
    # Rate limiting — keyed on the *real* client IP (post-realip resolution).
    # `req_general` covers static asset traffic; `req_strict` throttles
    # navigations / dynamic-feeling routes.
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=req_general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=req_strict:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Compression — Cloudflare's edge handles Brotli, so origin gzip is plenty
    # and keeps the runtime image free of third-party modules.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
