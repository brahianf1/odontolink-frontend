<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OdontoLink</title>
    <style id="odl-boot-styles">
      /* Pre-paint theme bootstrap.
         The CSS variables below hold the page background/foreground/accent
         used by the browser BEFORE React mounts. The `%ODL_*%` placeholders
         are substituted at build time by the `odl-boot-colors` Vite plugin
         with the resolved tokens of the variant declared in
         VITE_THEME_VARIANT (falls back to theme-26 if unset). That makes
         the first painted frame match the env-default theme without any
         flash from a generic fallback.

         The /boot.js script loaded just below overrides these vars on
         every boot when a paint cache or cached siteConfig is found in
         localStorage, eliminating the flash entirely for returning users.

         Once React mounts, MUI's CssBaseline takes over the body styling
         from the active theme; these inline rules only matter for the
         first ~50–200 ms before that happens. */
      :root {
        --odl-page-bg: %ODL_BG_LIGHT%;
        --odl-page-fg: %ODL_FG_LIGHT%;
        --odl-page-accent: %ODL_ACCENT_LIGHT%;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --odl-page-bg: %ODL_BG_DARK%;
          --odl-page-fg: %ODL_FG_DARK%;
          --odl-page-accent: %ODL_ACCENT_DARK%;
        }
      }
      html,
      body {
        margin: 0;
        background-color: var(--odl-page-bg);
        color: var(--odl-page-fg);
      }

      /* Boot splash — visible only for first-time / cache-cleared sessions
         (boot.js adds `.odl-needs-splash` to <html> only then). */
      #odl-boot-splash {
        display: none;
      }
      html.odl-needs-splash #odl-boot-splash {
        position: fixed;
        inset: 0;
        background: var(--odl-page-bg);
        color: var(--odl-page-fg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 99999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        transition: opacity 240ms ease-out;
      }
      html.odl-needs-splash #odl-boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      html.odl-needs-splash #odl-boot-splash > .odl-splash-dot {
        width: 36px;
        height: 36px;
        background: var(--odl-page-accent);
        border-radius: 0;
      }
      html.odl-needs-splash #odl-boot-splash > .odl-splash-label {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        opacity: 0.85;
      }
      @media (prefers-reduced-motion: no-preference) {
        html.odl-needs-splash #odl-boot-splash > .odl-splash-dot {
          animation: odl-boot-pulse 1.4s ease-in-out infinite;
        }
      }
      @keyframes odl-boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.78);
          opacity: 0.5;
        }
      }
    </style>
    <!-- Pre-paint theme bootstrap. External file (served from same origin),
         so strict `script-src 'self'` allows it without 'unsafe-inline'.
         Must stay synchronous — no defer/async — because it sets CSS vars
         and a class on <html> before the body paints. -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="odl-boot-splash" aria-hidden="true" aria-busy="true">
      <div class="odl-splash-dot"></div>
      <div class="odl-splash-label">OdontoLink</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
